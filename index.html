<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India - Watch Shows Online,Watch Movies Online</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="icon" href="https://images.icon-icons.com/2699/PNG/512/netflix_logo_icon_170919.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Hero -->
    <section class="hero">
        <!-- Dark Overlay -->
        <div class="overlay"></div>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg position-relative">
            <div class="container mt-2">
                <!-- Logo -->
                <a class="navbar-brand netflix-logo ms-5" href="#">
                    <img src="./AAAAAdEhm1UzVexHjKqFOP9W6E2UVtkWFvL-vdxIEbTU81rsqNuPmDDy_dQvmQ85ath49JBruVV4aGQA3gY2Dl5SiqFf-AEwPAZBTNkW8FMxGXpDN2mHrf8KlRRiddj1P422ZW1eZkZNWLTd.svg"
                        alt="netflix-logo" width=150px>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <div class="language-selector ms-4">

                        <span class="language-icon">文A</span>

                        <select id="languageSelect" name="LanguageSelect">
                            <option value="en-IN" selected>English</option>
                            <option value="hi-IN">हिन्दी</option>
                        </select>

                    </div>
                    <!-- Sign In -->
                    <a href="./signin.html">
                        <button class = "btn signin-btn btn-danger fw-bold">Sign In</button>
                    </a>
                </div>
            </div>
            </div>
        </nav>

        <!-- Login details and get started -->
        <div class="hero-content mt-5">
            <h1>More watching. Less
                <br> scrolling.</h1>
            <h4>
                Starts at ₹149. Cancel at any time.
            </h4>

            <p>
                Ready to watch? Enter your email to create or restart
                your membership.
            </p>

            <!-- Email section -->
            <div class="email-section ">

                <input type="email"  class="email-input" placeholder="Email address" required>

                <button class="get-started">
                    <p>Get Started > </p> 

                </button>

            </div>

        </div>
    </section>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
