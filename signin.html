<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix</title>

    <link rel="icon" href="https://images.icon-icons.com/2699/PNG/512/netflix_logo_icon_170919.png">

    <link rel="stylesheet" href="signin.css">
    <link rel="stylesheet" href="signin.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Header -->

    <header class="signin-header">

        <div class="container">

            <a href="index.html">
                <img src="./AAAAAdEhm1UzVexHjKqFOP9W6E2UVtkWFvL-vdxIEbTU81rsqNuPmDDy_dQvmQ85ath49JBruVV4aGQA3gY2Dl5SiqFf-AEwPAZBTNkW8FMxGXpDN2mHrf8KlRRiddj1P422ZW1eZkZNWLTd.svg"
                    alt="Netflix" class="signin-logo">
            </a>

        </div>

    </header>


    <!-- Sign In -->

    <main class="signin-main">

        <div class="signin-box">

            <h1>Enter your info to sign in</h1>

            <p class="subtitle">
                Or get started with a new account.
            </p>
        <form >
            <div class="form-floating">
                <textarea class="form-control btn-dark signin-input" placeholder="Leave a comment here"
                    id="floatingTextarea" required></textarea>
                <label for="floatingTextarea">Email or mobile number</label>
            </div>


            <button class="continue-btn">
                Continue
            </button>
        </form>
            <div class="help">
                Get Help
                <select id = "sec">
                    <option value="1" class="op">Forgot email or mobile number?</option>
                    <option value="2" class="op">Learn more about sign-in</option>
                </select>

            </div>

            <p class="recaptcha">
                This page is protected by Google reCAPTCHA to ensure
                you're not a bot.
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
